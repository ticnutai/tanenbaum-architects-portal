<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>בדיקת אוטומציה מקומית</title>
    <style>
      body { font-family: Arial, sans-serif; background: #f4f7fb; color: #10234a; margin: 0; }
      main { width: min(560px, calc(100% - 40px)); margin: 60px auto; padding: 32px; background: white; border: 1px solid #dbe3ef; border-radius: 16px; box-shadow: 0 8px 30px #10234a14; }
      h1 { margin-top: 0; }
      label { display: block; margin-top: 18px; font-weight: 700; }
      input, select, button { box-sizing: border-box; width: 100%; margin-top: 8px; padding: 12px; font: inherit; border-radius: 8px; border: 1px solid #9aabc2; }
      button { margin-top: 24px; background: #102d61; color: white; border: 0; cursor: pointer; font-weight: 700; }
      #result { margin-top: 24px; padding: 16px; background: #e9f8ef; color: #17653a; border-radius: 8px; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>טופס בדיקת אוטומציה</h1>
      <label for="customer">שם לבדיקה</label>
      <input id="customer" name="customer" autocomplete="off" />

      <label for="department">מחלקה</label>
      <select id="department" name="department">
        <option value="">בחרו</option>
        <option value="architecture">אדריכלות</option>
        <option value="planning">תכנון</option>
      </select>

      <button id="submit" type="button">שמירת בדיקה</button>
      <div id="result" role="status" hidden></div>
    </main>
    <script>
      document.querySelector("#submit").addEventListener("click", () => {
        const name = document.querySelector("#customer").value;
        const select = document.querySelector("#department");
        const department = select.options[select.selectedIndex]?.text || "";
        const result = document.querySelector("#result");
        result.textContent = `הבדיקה הושלמה: ${name} — ${department}`;
        result.hidden = false;
      });
    </script>
  </body>
</html>
