<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>בדיקת הקלטה מקצה לקצה</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 560px; margin: 48px auto; padding: 24px; }
      label { display: block; margin-top: 18px; font-weight: 700; }
      input, select, button { width: 100%; box-sizing: border-box; margin-top: 8px; padding: 12px; }
      button { cursor: pointer; }
      #result { margin-top: 18px; color: #087443; }
    </style>
  </head>
  <body>
    <h1>בדיקת הקלטה מקצה לקצה</h1>
    <label for="client-name">שם לקוח</label>
    <input id="client-name" name="client_name" placeholder="הזן שם לקוח" />

    <label for="committee">ועדה</label>
    <select id="committee" name="committee">
      <option value="">בחר ועדה</option>
      <option value="s fields">שדות דן</option>
      <option value="tel-aviv">תל אביב</option>
    </select>

    <button id="save-test" type="button" onclick="document.getElementById('result').textContent='שלוש הפעולות בוצעו'">
      שמירת בדיקה
    </button>
    <p id="result" role="status"></p>
  </body>
</html>
