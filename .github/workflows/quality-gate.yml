name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  source-and-ui:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: npm run qa:source
